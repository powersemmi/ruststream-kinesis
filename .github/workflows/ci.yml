name: CI

on:
  push:
    branches: [main]
  # No base filter: a pull request stacked on another one has a branch for its base, and a filter
  # naming `main` leaves it with no checks at all - which reads as a conflicting branch rather
  # than as a workflow that declined to run.
  #
  # A draft runs nothing until it is marked ready for review, which is what `ready_for_review` is
  # here for: an agent opens its work as a draft, and the maintainer decides when CI spends its
  # time on it. It has to be listed because naming any type at all replaces the default set.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    # Every other job needs this one, so the draft gate lives here: a skipped gate skips them all.
    if: >-
      github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'properdocs.yml'
              - 'overrides/**'
              - 'crates/ruststream-kinesis/examples/**'
              - 'scripts/lint_doc_fences.py'
              - 'scripts/check_doc_i18n.py'
              - 'scripts/doc_glossary.toml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint and checks
    needs: changes
    # One runner for every check outside the build job: the dependency graph, spelling, the
    # workflows, formatting, lints, each feature alone and minimal versions. Not path-gated as a
    # whole: advisories arrive over time, not only with manifest changes, so `cargo deny` runs on
    # every pull request, and so do the spelling and workflow scans, which read the whole tree.
    # The Rust steps run when the Rust sources changed. Each check runs whatever the one before
    # it did, so a red formatting step hides no later verdict. Minimal versions rewrites the lock
    # file and the manifests for good, so it comes last.
    runs-on: ubuntu-latest
    env:
      RUST_CHANGED: ${{ needs.changes.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.18
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate versions, and
      # registry sources, per the checked-in deny.toml.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        if: "!cancelled()"
        uses: astral-sh/setup-uv@v7

      - name: codespell
        if: "!cancelled()"
        run: uvx codespell

      - name: zizmor
        if: "!cancelled()"
        run: uvx zizmor .github/workflows

      # The floor follows `rust-version` in Cargo.toml, so an MSRV bump is a one-line change.
      - name: Resolve the floor toolchain
        id: msrv
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: |
          toolchain="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$toolchain"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      # Installed beside stable, which `rust-toolchain.toml` keeps the default: the floor for
      # minimal versions and a nightly for its resolver.
      - name: Install the extra toolchains
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        env:
          FLOOR: ${{ steps.msrv.outputs.toolchain }}
        run: rustup toolchain install --profile minimal "$FLOOR" nightly

      - name: Cache cargo
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        uses: taiki-e/install-action@v2.87.18
        with:
          tool: cargo-hack

      - name: cargo fmt
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: cargo fmt --all -- --check

      # The benchmark package is left out of the all-features lints on purpose: it is built with
      # the feature set a service ships, and the framework's harness feature is a compile error in
      # it. Its own lint follows, so it stays linted and stays compiled; `just bench` runs it.
      - name: cargo clippy
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: |
          cargo clippy --locked --workspace --exclude ruststream-kinesis-bench --all-targets \
            --all-features -- -D warnings
          cargo clippy --locked -p ruststream-kinesis-bench --all-targets -- -D warnings

      # The all-features and no-default-features builds cover both ends of the range and nothing
      # between them, so a feature that only compiles next to another one passes there.
      # --no-dev-deps: a dev-dependency in scope masks a missing feature gate in the library.
      # It also rewrites the manifests while it runs, which is why it has no --locked and comes
      # after every step that needs the tree as checked in.
      - name: cargo hack check (each feature)
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: cargo hack check --workspace --each-feature --no-dev-deps

      # Minimal versions is one chain: each step runs only when the one before it succeeded, since
      # a step on a graph that failed to resolve checks nothing.
      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        id: minimal-resolve
        if: "!cancelled() && env.RUST_CHANGED == 'true'"
        run: cargo +nightly update -Z minimal-versions

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor. Every bound in the
      # graph holds at its floor. When one does not, a `cargo update -p <crate> --precise
      # <version>` step goes before this one with the reason and the condition for dropping it,
      # rather than raising the declared bound to hide it.
      - name: Build and test against minimal versions
        id: minimal-test
        if: "!cancelled() && steps.minimal-resolve.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: |
          cargo check --locked --workspace --exclude ruststream-kinesis-bench --all-targets \
            --all-features
          cargo check --locked -p ruststream-kinesis-bench --all-targets
          cargo test --locked --workspace --all-features --no-fail-fast

      # Everything above still sees dev-dependencies, which raise shared floors before the library
      # is built: the run proves the workspace resolves, not that the manifest is honest for a
      # consumer. Drop them and resolve again, so the graph is the one a dependent gets. Runs last
      # because it rewrites the manifests in place.
      - name: Resolve minimal versions without dev-dependencies
        id: minimal-resolve-lib
        if: "!cancelled() && steps.minimal-test.outcome == 'success'"
        run: |
          cargo hack --remove-dev-deps
          cargo +nightly update -Z minimal-versions

      # The library as a dependency, on the floor toolchain. No --locked: cargo-hack edits the
      # manifests it checks.
      - name: Check the library against its own declared floors
        id: minimal-check-lib
        if: "!cancelled() && steps.minimal-resolve-lib.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: cargo hack check --workspace --no-dev-deps --all-features

  rust:
    name: Build and test
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    # Stable first, then the early warning and the floor on the same runner, and those two only
    # once stable passed as a whole: a break stable already reports is not worth two more
    # builds. Releases between the floor and stable add nothing: what fails on a later one fails
    # on the floor too. Stable is the default through `rust-toolchain.toml`; the later steps
    # name theirs through RUSTUP_TOOLCHAIN, which outranks the file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The floor follows `rust-version` in Cargo.toml, so an MSRV bump is a one-line change.
      - name: Resolve the floor toolchain
        id: msrv
        run: |
          toolchain="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
          test -n "$toolchain"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install beta and the floor
        env:
          FLOOR: ${{ steps.msrv.outputs.toolchain }}
        run: |
          rustup toolchain install --profile minimal --component clippy beta
          rustup toolchain install --profile minimal "$FLOOR"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: cargo check (no default features)
        run: cargo check --locked --workspace --no-default-features

      # The benchmark package is left out of every all-features check on purpose: it is built
      # with the feature set a service ships, and the framework's harness feature is a compile
      # error in it. Its own check follows, so it stays compiled.
      - name: cargo check (all features)
        run: |
          cargo check --locked --workspace --exclude ruststream-kinesis-bench --all-targets \
            --all-features
          cargo check --locked -p ruststream-kinesis-bench --all-targets

      # The in-process suite: the live tests skip themselves without KINESIS_TEST_ENDPOINT, and
      # the broker-integration job runs them against LocalStack.
      # --no-fail-fast: a failing target must not hide failures in the targets behind it; the log
      # then lists every red test, not just the first binary's.
      - name: cargo test
        run: cargo test --locked --workspace --all-features --no-fail-fast

      # The gate the later toolchains wait on: it succeeds only when every stable step did.
      - name: Stable passed
        id: stable
        run: echo "stable passed"

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks before
      # it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        continue-on-error: true
        env:
          RUSTUP_TOOLCHAIN: beta
        run: |
          cargo clippy --locked --workspace --exclude ruststream-kinesis-bench --all-targets \
            --all-features -- -D warnings
          cargo clippy --locked -p ruststream-kinesis-bench --all-targets -- -D warnings

      - name: cargo check (no default features, beta)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: beta
        run: cargo check --locked --workspace --no-default-features

      - name: cargo check (all features, beta)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: beta
        run: |
          cargo check --locked --workspace --exclude ruststream-kinesis-bench --all-targets \
            --all-features
          cargo check --locked -p ruststream-kinesis-bench --all-targets

      - name: cargo test (beta)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: beta
        run: cargo test --locked --workspace --all-features --no-fail-fast

      - name: cargo check (no default features, floor)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: cargo check --locked --workspace --no-default-features

      - name: cargo check (all features, floor)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: |
          cargo check --locked --workspace --exclude ruststream-kinesis-bench --all-targets \
            --all-features
          cargo check --locked -p ruststream-kinesis-bench --all-targets

      - name: cargo test (floor)
        if: "!cancelled() && steps.stable.outcome == 'success'"
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.toolchain }}
        run: cargo test --locked --workspace --all-features --no-fail-fast

  broker-integration:
    name: Broker integration (LocalStack)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned to the last token-free LocalStack tag; newer images require an auth token,
      # which fork PRs cannot read from secrets.
      - name: Start LocalStack
        run: |
          docker run -d --name localstack \
            -p 127.0.0.1:4566:4566 \
            -e SERVICES=kinesis,dynamodb -e KINESIS_LATENCY=0 \
            -e EAGER_SERVICE_LOADING=1 \
            -e SQS_ENDPOINT_STRATEGY=path \
            localstack/localstack:4.14.0

      - name: Wait for LocalStack
        timeout-minutes: 3
        run: |
          timeout 150 bash -c 'until curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q "\"kinesis\": \"running\""; do sleep 2; done'
          # DynamoDB backs the lease store, and its suite creates a table before it asserts.
          timeout 150 bash -c 'until curl -fsS http://127.0.0.1:4566/_localstack/health | grep -q "\"dynamodb\": \"running\""; do sleep 2; done'
          curl -fsS http://127.0.0.1:4566/_localstack/health

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run the live suites against LocalStack
        env:
          KINESIS_TEST_ENDPOINT: http://127.0.0.1:4566
          # This job started a stack, so a suite that skips past it is a defect, not a pass.
          RUSTSTREAM_REQUIRE_LIVE: "1"
        run: >-
          cargo test --locked -p ruststream-kinesis --all-features
          --test integration_kinesis
          --test conformance_kinesis
          --test positions_kinesis
          --test shards_kinesis
          --test leases_kinesis
          -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f localstack

  docs:
    name: Build site
    needs: [changes, lint]
    # After the lint job, and only when it passed: a site built from code that fails its own
    # gates is not worth the runner.
    if: >-
      needs.changes.outputs.docs == 'true'
      && needs.lint.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Lint doc code fences
        run: python3 scripts/lint_doc_fences.py

      - name: Check translated pages against their originals
        run: python3 scripts/check_doc_i18n.py

      - name: Build site (strict)
        run: properdocs build --strict

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: lint
    # After the lint job, and only when it passed. None of the three languages needs a build:
    # Rust and Python are extracted from source, and `actions` reads the workflows.
    if: needs.lint.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  result:
    name: CI result
    # The one check the `main` ruleset requires: it speaks for every job above, so a job that
    # comes, goes or is renamed never touches the ruleset. Skipped counts as passed, anything
    # else fails. A draft skips it with the rest, and the run that marking it ready starts
    # reports again.
    needs:
      - changes
      - lint
      - rust
      - broker-integration
      - docs
      - codeql
    if: >-
      always()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
