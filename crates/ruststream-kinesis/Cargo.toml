[package]
name = "ruststream-kinesis"
description = "Amazon Kinesis Data Streams broker implementation for the RustStream messaging framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["aws", "kinesis", "streaming", "broker", "ruststream"]
categories = ["asynchronous", "network-programming"]

[lints]
workspace = true

[features]
default = []
# What this broker contributes to the generated AsyncAPI document. The specification lists no
# Kinesis binding, so the crate writes its own `x-ruststream-kinesis` extension objects.
asyncapi = ["ruststream/asyncapi", "dep:serde"]
# A DynamoDB-backed lease store, so multiple service instances can share the shards.
dynamodb-lease = ["dep:aws-sdk-dynamodb"]
# The in-process test broker (TestableBroker + TestApp support). The conformance harness is a
# broker-author tool and stays in this repo's dev-dependencies, not in the user-facing feature.
testing = ["ruststream/testing"]

[dependencies]
ruststream = { workspace = true, default-features = false }
aws-config.workspace = true
aws-sdk-kinesis.workspace = true
aws-sdk-dynamodb = { workspace = true, optional = true }
bytes.workspace = true
futures.workspace = true
# Only the binding bodies of the `asyncapi` feature are serialized; a record's payload is the
# codec's business, not this crate's.
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# `cbor` earns its place in one check: a per-message step must not cost the mount site's codec,
# and proving that needs a second codec to mount.
ruststream = { workspace = true, features = ["conformance", "testing", "macros", "json", "cbor"] }
# A registration on the manual path is documented by default, so its message type derives
# `JsonSchema` whether or not the test turns the `asyncapi` feature on (the core re-exports
# `schemars` only under that feature).
schemars.workspace = true
serde.workspace = true
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[[example]]
name = "kinesis_leases"
required-features = ["dynamodb-lease"]
